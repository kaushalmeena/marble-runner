name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: it publishes via OIDC rather than a token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are cancelled rather than
# queued, because only the newest build is worth publishing.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  export:
    name: Export web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates"

          curl -sSfL -o /tmp/godot.zip \
            "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot

          # The .tpz is a zip whose contents sit under templates/, and Godot
          # expects them in a directory named for the exact version.
          curl -sSfL -o /tmp/templates.tpz \
            "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import project
        # A cold .godot cache can report failure while still importing enough
        # to export. The export step below is the real gate, so a hiccup here
        # is not worth failing the run over.
        continue-on-error: true
        run: godot --headless --import

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p dist/web
          godot --headless --export-release "Web" dist/web/index.html

      - name: Verify the export produced something
        run: |
          set -euo pipefail
          for required in index.html index.pck index.wasm; do
            if [ ! -s "dist/web/$required" ]; then
              echo "::error::dist/web/$required is missing or empty"
              exit 1
            fi
          done
          ls -lh dist/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    name: Publish to GitHub Pages
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
