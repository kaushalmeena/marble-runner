<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Godot rasterises SVG with ThorVG, which does not match a browser on
    clip-path, group opacity or transforms. This icon therefore uses only
    plain shapes, solid fills and simple gradients, so the engine, the
    browser and the exported PNG all agree.

    The picture is the game: a marble on a checkered platform floating in
    the sky, with a gem to go and get.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1736"/>
      <stop offset="0.55" stop-color="#1E4C8F"/>
      <stop offset="1" stop-color="#5DB7DC"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.34" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#F2F9FF"/>
      <stop offset="0.3" stop-color="#7CC2FF"/>
      <stop offset="0.75" stop-color="#1F68CC"/>
      <stop offset="1" stop-color="#123F8E"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE58A"/>
      <stop offset="1" stop-color="#F2A21B"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#sky)"/>

  <!-- Soft clouds far below the platform. -->
  <ellipse cx="72" cy="234" rx="40" ry="11" fill="#8FD0EA"/>
  <ellipse cx="178" cy="240" rx="42" ry="10" fill="#A6DCF0"/>

  <!-- The platform: two side faces, then four checker tiles on top. -->
  <path d="M30 170 L128 212 L128 238 L30 196 Z" fill="#2F6B3C"/>
  <path d="M128 212 L226 170 L226 196 L128 238 Z" fill="#245231"/>
  <path d="M128 128 L177 149 L128 170 L79 149 Z" fill="#9BE07F"/>
  <path d="M177 149 L226 170 L177 191 L128 170 Z" fill="#6FC360"/>
  <path d="M79 149 L128 170 L79 191 L30 170 Z" fill="#6FC360"/>
  <path d="M128 170 L177 191 L128 212 L79 191 Z" fill="#9BE07F"/>

  <!-- The marble, its shadow, and the veins that make it a marble. -->
  <ellipse cx="128" cy="176" rx="36" ry="13" fill="#3C7F47"/>
  <circle cx="128" cy="126" r="48" fill="url(#ball)"/>
  <path d="M86 138 C104 118 128 150 150 128 C158 120 164 122 168 118" fill="none"
        stroke="#CFE9FF" stroke-width="5" stroke-linecap="round"/>
  <path d="M98 160 C114 150 126 166 146 156" fill="none"
        stroke="#9CD0FF" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="110" cy="104" rx="15" ry="9" fill="#FFFFFF"/>

  <!-- A gem, up and to the right. -->
  <path d="M200 34 L220 60 L200 92 L180 60 Z" fill="url(#gem)"/>
  <path d="M200 34 L200 92 L180 60 Z" fill="#FFF1B5"/>
  <path d="M180 60 L220 60 L200 92 Z" fill="#E08F12"/>
  <path d="M180 60 L200 60 L200 92 Z" fill="#F6BC3A"/>
</svg>
